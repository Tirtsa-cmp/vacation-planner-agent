<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Planner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            🌎 Vacation Planner
        </div>


        <ul class="nav-links">

            <li><a href="#home">Home</a></li>

            <li><a href="#discover">Discover</a></li>

            <li><a href="#planner">Planner</a></li>

        </ul>

    </nav>


    <!-- HERO -->
    <section class="hero" id="home">

        <div class="hero-content">

            <h1>Vacation Planner</h1>

            <p>
                Plan your perfect vacation with our easy-to-use vacation planner!
            </p>


            <div class="planner-box" id="planner">
<div class="fields">

        
                <div class="input-group">
                    <label for="number_of_people">Number of People</label>
                    <input type="number" id="number_of_people" min="1" placeholder="2">
                </div>


                <div class="input-group">
                    <label for="number_of_days">Number of Days</label>
                    <input type="number" id="number_of_days" min="1" placeholder="7">
                </div>


                <div class="input-group">
                    <label for="preferences">Preferences</label>
                    <textarea id="preferences" placeholder="Beach, adventure, culture..."></textarea>
                </div>


                <div class="input-group">
                    <label for="budget">Budget ($)</label>
                    <input type="number" id="budget" placeholder="2000">
                </div>

</div>
                <button type="button" id="plan-button">
                    ✈️ Plan Vacation
                </button>


            </div>

        </div>

    </section>


    <!-- DISCOVER SECTION -->
    <section class="about" id="discover">

        <h2>
            Discover Your Next Adventure 🌎
        </h2>


        <p>
            Tell us what kind of vacation you are looking for,
            and we'll help you find the perfect destination.
        </p>


        <button type="button" id="create-new-vacation">
            Create New Vacation
        </button>


    </section>


    <script src="script.js"></script>

</body>
